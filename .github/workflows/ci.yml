name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: researchmind
          POSTGRES_PASSWORD: researchmind
          POSTGRES_DB: researchmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U researchmind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql+psycopg://researchmind:researchmind@localhost:5432/researchmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app evaluation scripts
      - name: Tests (unit + integration)
        run: pytest -q -m "not live" --cov=researchmind --cov-report=term

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile -t researchmind:ci .
